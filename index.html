<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Our Universe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #030308;
    --gold: #E8C888;
    --rose: #D98A9A;
    --violet: #4A3B6B;
    --text: #F2EFE9;
    --text-dim: rgba(242,239,233,0.55);
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.10);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #scene-canvas{ position:fixed; inset:0; display:block; }

  /* ---------- Opening overlay ---------- */
  #opening{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 8vw;
    pointer-events:none;
    z-index:20;
  }
  .quote{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.35rem, 4.4vw, 2.4rem);
    line-height:1.5;
    color:var(--text);
    opacity:0;
    letter-spacing:0.01em;
    max-width:640px;
    text-shadow: 0 0 40px rgba(232,200,136,0.15);
  }
  #enter-btn{
    margin-top:3rem;
    position:relative;
    pointer-events:auto;
    padding:0.95rem 2.6rem;
    border-radius:999px;
    border:1px solid rgba(232,200,136,0.35);
    background: rgba(232,200,136,0.06);
    backdrop-filter: blur(12px);
    color:var(--gold);
    font-family:'Manrope',sans-serif;
    font-size:0.92rem;
    font-weight:500;
    letter-spacing:0.06em;
    cursor:pointer;
    opacity:0;
    transform: translateY(8px);
    transition: box-shadow 0.4s ease, transform 0.25s ease, background 0.3s ease;
    box-shadow: 0 0 0px rgba(232,200,136,0);
  }
  #enter-btn:hover{
    background: rgba(232,200,136,0.12);
    box-shadow: 0 0 30px rgba(232,200,136,0.25);
    transform: translateY(6px) scale(1.02);
  }
  #enter-btn:active{ transform: translateY(6px) scale(0.98); }
  #enter-btn.show{ opacity:1; transform:translateY(0); animation: pulse-glow 3.2s ease-in-out infinite; }
  @keyframes pulse-glow{
    0%,100%{ box-shadow: 0 0 14px rgba(232,200,136,0.12); }
    50%{ box-shadow: 0 0 34px rgba(232,200,136,0.30); }
  }

  /* ripple */
  .ripple{
    position:absolute; border-radius:50%;
    background: radial-gradient(circle, rgba(232,200,136,0.5), transparent 70%);
    transform: translate(-50%,-50%) scale(0);
    pointer-events:none;
    animation: ripple-out 0.9s ease-out forwards;
  }
  @keyframes ripple-out{ to{ transform:translate(-50%,-50%) scale(1); opacity:0; } }

  /* ---------- Flight flash / vignette ---------- */
  #flight-veil{
    position:fixed; inset:0; z-index:15; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 30%, #030308 100%);
    opacity:0;
  }
  #flight-flash{
    position:fixed; inset:0; z-index:16; pointer-events:none;
    background: white; opacity:0;
  }

  /* ---------- HUD (main universe) ---------- */
  #hud{
    position:fixed; inset:0; z-index:10; pointer-events:none;
    opacity:0;
  }
  #hud .title{
    position:absolute; top: max(24px, env(safe-area-inset-top)); left:0; right:0;
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic; font-weight:500;
    font-size:1.15rem;
    letter-spacing:0.08em;
    color:var(--text-dim);
  }
  #hint{
    position:absolute; bottom: max(28px, env(safe-area-inset-bottom));
    left:0; right:0; text-align:center;
    font-size:0.72rem; letter-spacing:0.08em; color:var(--text-dim);
    text-transform:uppercase;
  }

  /* ---------- Planet modal ---------- */
  #modal-backdrop{
    position:fixed; inset:0; z-index:30;
    background: rgba(3,3,8,0.55);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 0.35s ease;
    padding: 24px;
  }
  #modal-backdrop.open{ opacity:1; pointer-events:auto; }
  #modal-card{
    width:min(420px, 100%);
    background: var(--glass);
    border:1px solid var(--glass-border);
    border-radius:22px;
    backdrop-filter: blur(20px);
    padding: 2.2rem 1.9rem;
    text-align:center;
    transform: translateY(18px) scale(0.97);
    transition: transform 0.4s cubic-bezier(.2,.9,.25,1);
  }
  #modal-backdrop.open #modal-card{ transform: translateY(0) scale(1); }
  #modal-icon{ font-size:2.4rem; margin-bottom:0.9rem; filter: drop-shadow(0 0 18px rgba(232,200,136,0.35)); }
  #modal-name{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500;
    font-size:1.6rem; margin-bottom:0.6rem; color:var(--gold);
  }
  #modal-desc{ font-size:0.92rem; line-height:1.6; color:var(--text-dim); margin-bottom:1.6rem; }
  #modal-close{
    border:1px solid var(--glass-border); background:transparent; color:var(--text);
    padding:0.6rem 1.6rem; border-radius:999px; font-size:0.8rem; letter-spacing:0.05em;
    cursor:pointer; font-family:'Manrope',sans-serif;
  }
  #modal-close:hover{ background: rgba(255,255,255,0.06); }
  #modal-locked-note{ font-size:0.72rem; color:var(--rose); margin-top:-0.9rem; margin-bottom:1.4rem; letter-spacing:0.03em; }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
</style>
</head>
<body>

<canvas id="scene-canvas"></canvas>

<div id="opening">
  <p class="quote" id="quote-text"></p>
  <button id="enter-btn" type="button">Masuk ke Semesta Kita</button>
</div>

<div id="flight-veil"></div>
<div id="flight-flash"></div>

<div id="hud">
  <div class="title">Our Universe</div>
  <div id="hint">Sentuh sebuah planet</div>
</div>

<div id="modal-backdrop">
  <div id="modal-card" role="dialog" aria-modal="true">
    <div id="modal-icon"></div>
    <div id="modal-name"></div>
    <p id="modal-locked-note" class="sr-only"></p>
    <p id="modal-desc"></p>
    <button id="modal-close" type="button">Tutup</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script type="module">
import * as THREE from "three";

/* =========================================================================
   DATA LAYER
   In this preview the data is inlined so the experience runs standalone.
   In the real /data-driven build, replace this block with:
     const settings = await (await fetch('/data/settings.json')).json();
     const { planets } = await (await fetch('/data/planets.json')).json();
   The shape is identical to /data/settings.json and /data/planets.json
   in this project — swapping to fetch() is a two-line change.
   ========================================================================= */
const settings = {
  openingQuote: "«Di alam semesta yang begitu luas, aku tetap menemukanmu.»",
  entryButtonLabel: "Masuk ke Semesta Kita",
  theme: { accentGold: "#E8C888", accentRose: "#D98A9A", nebulaViolet: "#4A3B6B" }
};
const planets = [
  { id:"memories", icon:"🌍", name:"Memories", color:0x4A90A4, ring:null, size:1.1, orbitRadius:9,  orbitSpeed:0.09,  description:"Every moment worth keeping, kept." },
  { id:"letters",  icon:"🌙", name:"Letters",  color:0xC9B8DB, ring:null, size:0.85,orbitRadius:13, orbitSpeed:0.065, description:"Words I couldn't say out loud." },
  { id:"dreams",   icon:"🪐", name:"Dreams",   color:0xD9A24B, ring:0xE8C888, size:1.4, orbitRadius:18, orbitSpeed:0.045, description:"Everything we're still building toward." },
  { id:"garden",   icon:"🌸", name:"Garden",   color:0x7FA37A, ring:null, size:1.0, orbitRadius:23, orbitSpeed:0.032, description:"Something living, growing with us." },
  { id:"secret",   icon:"☄",  name:"Secret Planet", color:0x8B5A6B, ring:null, size:0.7, orbitRadius:28, orbitSpeed:0.02, description:"A private corner of the universe.", locked:true }
];

/* =========================================================================
   RENDERER / SCENE / CAMERA
   ========================================================================= */
const canvas = document.getElementById('scene-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x030308, 0.0018);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 4000);
camera.position.set(0, 0, 600); // deep space, far from the system at start

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- Starfield ---------- */
function makeStars(count, spread, size, opacity){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    pos[i*3+0] = (Math.random()-0.5)*spread;
    pos[i*3+1] = (Math.random()-0.5)*spread;
    pos[i*3+2] = (Math.random()-0.5)*spread;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({
    color: 0xffffff, size, transparent:true, opacity:0,
    sizeAttenuation:true, depthWrite:false
  });
  const pts = new THREE.Points(geo, mat);
  pts.userData.targetOpacity = opacity;
  scene.add(pts);
  return pts;
}
const starsFar  = makeStars(3200, 3200, 1.4, 0.85);
const starsNear = makeStars(1400, 1600, 2.1, 1.0);
const starLayers = [starsFar, starsNear];

// gentle twinkle via per-frame opacity jitter on near layer material
let twinkleClock = 0;

/* ---------- Nebula clouds (soft sprites) ---------- */
function makeNebula(){
  const group = new THREE.Group();
  const canvasTex = (color) => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(128,128,0,128,128,128);
    g.addColorStop(0, color + 'AA');
    g.addColorStop(1, color + '00');
    ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(c);
  };
  const colors = ['#4A3B6B','#2E4A5B','#5B3B4A'];
  for(let i=0;i<6;i++){
    const tex = canvasTex(colors[i % colors.length]);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent:true, opacity:0, depthWrite:false, blending: THREE.AdditiveBlending });
    const spr = new THREE.Sprite(mat);
    const s = 500 + Math.random()*700;
    spr.scale.set(s,s,1);
    spr.position.set((Math.random()-0.5)*1800,(Math.random()-0.5)*900,(Math.random()-0.5)*1800 - 400);
    group.add(spr);
  }
  scene.add(group);
  return group;
}
const nebula = makeNebula();

/* ---------- Solar system (hidden until arrival) ---------- */
const system = new THREE.Group();
system.visible = false;
system.position.set(0,0,-2000); // parked far away; camera flies to it
scene.add(system);

const sunLight = new THREE.PointLight(0xffe3b0, 3.2, 400, 1.4);
system.add(sunLight);
system.add(new THREE.AmbientLight(0x2a2440, 0.6));

const sunGeo = new THREE.SphereGeometry(3.6, 48, 48);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xFFD98A });
const sun = new THREE.Mesh(sunGeo, sunMat);
system.add(sun);

// sun corona (sprite glow)
(function(){
  const c = document.createElement('canvas'); c.width=c.height=256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'#FFEFC7CC'); g.addColorStop(0.4,'#E8C88866'); g.addColorStop(1,'#E8C88800');
  ctx.fillStyle=g; ctx.fillRect(0,0,256,256);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
  spr.scale.set(20,20,1);
  system.add(spr);
})();

const planetMeshes = [];
planets.forEach(p => {
  const orbitPivot = new THREE.Object3D();
  system.add(orbitPivot);

  // orbit ring (faint)
  const ringGeo = new THREE.RingGeometry(p.orbitRadius-0.02, p.orbitRadius+0.02, 128);
  const ringMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.06, side:THREE.DoubleSide });
  const ringMesh = new THREE.Mesh(ringGeo, ringMat);
  ringMesh.rotation.x = Math.PI/2;
  system.add(ringMesh);

  const geo = new THREE.SphereGeometry(p.size, 32, 32);
  const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness:0.55, metalness:0.15, emissive:p.color, emissiveIntensity:0.06 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(p.orbitRadius, 0, 0);
  mesh.userData = { ...p, baseScale:1, pivot:orbitPivot, angle: Math.random()*Math.PI*2 };
  orbitPivot.rotation.y = mesh.userData.angle;
  orbitPivot.add(mesh);

  if(p.ring){
    const rg = new THREE.RingGeometry(p.size*1.5, p.size*2.1, 48);
    const rm = new THREE.MeshBasicMaterial({ color: p.ring, transparent:true, opacity:0.55, side:THREE.DoubleSide });
    const rmesh = new THREE.Mesh(rg, rm);
    rmesh.rotation.x = Math.PI/2.6;
    mesh.add(rmesh);
  }

  if(p.locked){
    mat.color.multiplyScalar(0.6);
  }

  planetMeshes.push(mesh);
});

/* =========================================================================
   ANIMATION LOOP
   ========================================================================= */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  // fade-in of star layers / nebula (driven externally via userData.targetOpacity)
  starLayers.forEach(s => {
    s.material.opacity += (s.userData.targetOpacity - s.material.opacity) * Math.min(1, dt*0.6);
  });
  nebula.children.forEach(n => {
    const target = n.userData.targetOpacity ?? 0;
    n.material.opacity += (target - n.material.opacity) * Math.min(1, dt*0.5);
  });

  // twinkle
  twinkleClock += dt;
  starsNear.material.opacity = starsNear.userData.targetOpacity * (0.85 + 0.15*Math.sin(twinkleClock*3));

  // gentle ambient drift
  starsFar.rotation.y += dt*0.002;
  starsNear.rotation.y += dt*0.0035;
  nebula.rotation.y += dt*0.0008;

  // planet orbits
  planetMeshes.forEach(m => {
    m.userData.pivot.rotation.y += dt * m.userData.orbitSpeed;
    m.rotation.y += dt*0.4;
    const hovered = m.userData.hovered ? 1.18 : 1;
    const s = m.userData.size * hovered;
    m.scale.setScalar(THREE.MathUtils.lerp(m.scale.x, s, 0.15));
  });
  sun.rotation.y += dt*0.05;

  renderer.render(scene, camera);
}
animate();

/* =========================================================================
   OPENING SEQUENCE
   ========================================================================= */
const quoteEl = document.getElementById('quote-text');
quoteEl.textContent = settings.openingQuote;
const enterBtn = document.getElementById('enter-btn');
enterBtn.textContent = settings.entryButtonLabel;

const tl = gsap.timeline({ delay: 0.4 });
// 1. stars fade in
tl.to(starsFar.userData, { targetOpacity: 0.85, duration: 3.2, ease:'power1.out' }, 0);
tl.to(starsNear.userData, { targetOpacity: 1.0, duration: 3.6, ease:'power1.out' }, 0.3);
// 2. nebula fades in
nebula.children.forEach((n,i) => {
  n.userData = { targetOpacity: 0.5 + Math.random()*0.2 };
  tl.to(n.userData, { targetOpacity: n.userData.targetOpacity, duration: 4, ease:'power1.out' }, 0.6 + i*0.15);
});
// 3. quote
tl.to(quoteEl, { opacity:1, duration: 1.8, ease:'power2.out' }, 2.6);
// 4. button
tl.add(() => enterBtn.classList.add('show'), 4.4);

/* ripple + camera flight on enter */
enterBtn.addEventListener('click', (e) => {
  if(enterBtn.dataset.locked) return;
  enterBtn.dataset.locked = "1";

  const rect = enterBtn.getBoundingClientRect();
  const r = document.createElement('div');
  r.className = 'ripple';
  const size = Math.max(rect.width, rect.height) * 2.4;
  r.style.width = r.style.height = size + 'px';
  r.style.left = (e.clientX - rect.left) + 'px';
  r.style.top = (e.clientY - rect.top) + 'px';
  enterBtn.appendChild(r);
  setTimeout(()=>r.remove(), 900);

  beginFlight();
});

function beginFlight(){
  const opening = document.getElementById('opening');
  const veil = document.getElementById('flight-veil');
  const flash = document.getElementById('flight-flash');
  const hud = document.getElementById('hud');

  const flightTl = gsap.timeline();

  // fade out opening UI
  flightTl.to(opening, { opacity:0, duration:0.6, ease:'power1.out' }, 0);

  // camera accelerates forward — stars streak past via FOV punch + fast z translation
  flightTl.to(camera, {
    fov: 100, duration: 1.6, ease:'power2.in',
    onUpdate: () => camera.updateProjectionMatrix()
  }, 0.2);
  flightTl.to(camera.position, {
    z: -1500, duration: 2.4, ease:'power3.in'
  }, 0.2);
  flightTl.to(veil, { opacity:0.9, duration:1.2, ease:'power1.in' }, 0.8);

  // white flash at arrival
  flightTl.to(flash, { opacity:1, duration:0.18, ease:'power1.in' }, 2.35);

  // snap camera to arrival position, reveal system
  flightTl.add(() => {
    system.visible = true;
    camera.fov = 60;
    camera.position.set(0, 14, 46);
    camera.lookAt(0,0,0);
    camera.updateProjectionMatrix();
  }, 2.5);

  flightTl.to(flash, { opacity:0, duration:0.9, ease:'power2.out' }, 2.55);
  flightTl.to(veil, { opacity:0, duration:1.6, ease:'power2.out' }, 2.6);
  flightTl.to(hud, { opacity:1, duration:1.2, ease:'power1.out' }, 3.0);
  flightTl.add(() => { opening.style.display = 'none'; }, 3.6);
}

/* =========================================================================
   PLANET INTERACTION (pointer + touch)
   ========================================================================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hoveredMesh = null;

function pointerToNDC(clientX, clientY){
  pointer.x = (clientX/innerWidth)*2 - 1;
  pointer.y = -(clientY/innerHeight)*2 + 1;
}

canvas.addEventListener('pointermove', (e) => {
  if(!system.visible) return;
  pointerToNDC(e.clientX, e.clientY);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(planetMeshes);
  if(hoveredMesh) hoveredMesh.userData.hovered = false;
  hoveredMesh = hits[0]?.object ?? null;
  if(hoveredMesh) hoveredMesh.userData.hovered = true;
  canvas.style.cursor = hoveredMesh ? 'pointer' : 'default';
});

canvas.addEventListener('pointerdown', (e) => {
  if(!system.visible) return;
  pointerToNDC(e.clientX, e.clientY);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(planetMeshes);
  if(hits[0]) openModal(hits[0].object.userData);
});

/* =========================================================================
   MODAL
   ========================================================================= */
const modalBackdrop = document.getElementById('modal-backdrop');
const modalIcon = document.getElementById('modal-icon');
const modalName = document.getElementById('modal-name');
const modalDesc = document.getElementById('modal-desc');
const modalLockedNote = document.getElementById('modal-locked-note');
document.getElementById('modal-close').addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', (e) => { if(e.target === modalBackdrop) closeModal(); });

function openModal(data){
  modalIcon.textContent = data.icon;
  modalName.textContent = data.name;
  modalDesc.textContent = data.description;
  if(data.locked){
    modalLockedNote.textContent = 'Terkunci — perlu kata sandi';
    modalLockedNote.classList.remove('sr-only');
  } else {
    modalLockedNote.classList.add('sr-only');
  }
  modalBackdrop.classList.add('open');
}
function closeModal(){ modalBackdrop.classList.remove('open'); }
</script>
</body>
</html>
